<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Sign in</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;        
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }

    .login-card {
      width: min(100%, 420px);
      padding: 40px;
      background: #fff;
      border: 1px solid #e6e9f0;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgb(24 39 75 / 8%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #5b61d6;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.2rem);
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 10px 0 28px;
      color: #687187;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      color: inherit;
      font: inherit;
      background: #fff;
      border: 1px solid #d9deea;
      border-radius: 10px;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    input::placeholder {
      color: #9aa2b3;
    }

    input:focus {
      border-color: #5b61d6;
      box-shadow: 0 0 0 3px rgb(91 97 214 / 16%);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0 24px;
      font-size: 0.88rem;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #596176;
    }

    .remember input {
      width: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: #5b61d6;
    }

    a {
      color: #5157c7;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      color: #fff;
      font: inherit;
      font-weight: 700;
      background: #555bd1;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: #454bbd;
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #aeb1ff;
      outline-offset: 3px;
    }

    .signup {
      margin: 24px 0 0;
      color: #687187;
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Sign in to your account</h1>
    <p class="intro">Enter your details below to continue.</p>

    <form action="#" method="post">
      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" name="remember">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
    </form>

    <p class="signup">Don't have an account? <a href="#">Create one</a></p>
  </main>
</body>
</html>
